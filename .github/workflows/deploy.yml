# main dalına her gönderimde siteyi derleyip GitHub Pages'e yayınlar.
name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Yayındaki eski özetle karşılaştırıp yeni ya da değişen sayfaları seçer (Bing, Yandex).
      - run: node scripts/indexnow.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow-urls.txt
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Yayından sonra seçilen adresleri IndexNow ile bildirir; hata yayını bozmaz.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: indexnow
      - run: node scripts/indexnow.mjs submit
